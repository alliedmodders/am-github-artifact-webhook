[project]
name = "github-artifact-webhook"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "requests>=2.32.0",
    "symstore==0.3.5",
    "pydantic-settings[yaml]>=2.14.2",
    "apscheduler>=3.11.3",
    "pymysql>=1.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.1",
    "ty>=0.0.68",
]

[tool.uv]
package = false
