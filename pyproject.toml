[project]
name = "github-artifact-webhook"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "requests>=2.32.0",
    "symstore==0.3.5",
    "pydantic-settings[yaml]>=2.16.0",
    "apscheduler>=3.11.3",
    "pymysql>=1.2.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
    "ty>=0.0.87",
]

[tool.uv]
package = false
