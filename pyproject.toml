[project]
name = "github-artifact-webhook"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "requests>=2.32.0",
    "symstore==0.3.5",
    "pydantic-settings[yaml]>=2.14.2",
    "apscheduler>=3.11.3",
    "pymysql>=1.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.uv]
package = false
